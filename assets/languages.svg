<svg width="560" height="210" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 210" role="img" aria-label="Language proficiency: Python 95, TypeScript 90, SQL 80, Go 60, Rust 40">
  <style>
    .label { font: 600 14px 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #E2E8F0; }
    .pct   { font: 500 12px 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #94A3B8; }
    .title { font: 600 12px 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace; fill: #10B981; letter-spacing: 1px; }
  </style>

  <text x="0" y="15" class="title">LANGUAGES I THINK IN</text>

  <!-- Python -->
  <text x="0" y="40" class="label">Python</text>
  <rect x="120" y="30" width="380" height="14" rx="7" fill="#1E293B"/>
  <rect x="120" y="30" width="361" height="14" rx="7" fill="#10B981">
    <animate attributeName="width" from="0" to="361" dur="1.4s" begin="0.0s" fill="freeze"/>
  </rect>
  <text x="540" y="40" class="pct" text-anchor="end">95%</text>

  <!-- TypeScript -->
  <text x="0" y="72" class="label">TypeScript</text>
  <rect x="120" y="62" width="380" height="14" rx="7" fill="#1E293B"/>
  <rect x="120" y="62" width="342" height="14" rx="7" fill="#10B981">
    <animate attributeName="width" from="0" to="342" dur="1.4s" begin="0.15s" fill="freeze"/>
  </rect>
  <text x="540" y="72" class="pct" text-anchor="end">90%</text>

  <!-- SQL -->
  <text x="0" y="104" class="label">SQL</text>
  <rect x="120" y="94" width="380" height="14" rx="7" fill="#1E293B"/>
  <rect x="120" y="94" width="304" height="14" rx="7" fill="#10B981">
    <animate attributeName="width" from="0" to="304" dur="1.4s" begin="0.30s" fill="freeze"/>
  </rect>
  <text x="540" y="104" class="pct" text-anchor="end">80%</text>

  <!-- Go -->
  <text x="0" y="136" class="label">Go</text>
  <rect x="120" y="126" width="380" height="14" rx="7" fill="#1E293B"/>
  <rect x="120" y="126" width="228" height="14" rx="7" fill="#10B981">
    <animate attributeName="width" from="0" to="228" dur="1.4s" begin="0.45s" fill="freeze"/>
  </rect>
  <text x="540" y="136" class="pct" text-anchor="end">60%</text>

  <!-- Rust -->
  <text x="0" y="168" class="label">Rust</text>
  <rect x="120" y="158" width="380" height="14" rx="7" fill="#1E293B"/>
  <rect x="120" y="158" width="152" height="14" rx="7" fill="#A7F3D0">
    <animate attributeName="width" from="0" to="152" dur="1.4s" begin="0.60s" fill="freeze"/>
  </rect>
  <text x="540" y="168" class="pct" text-anchor="end">40%</text>

  <!-- Footer hint -->
  <text x="0" y="200" class="pct">self-assessed · last updated when I last shipped something in it</text>
</svg>
